apiVersion: v1
kind: Secret
metadata:
  name: agentops-secrets
  namespace: agentops
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_CLUSTER_POSTGRES_PASSWORD"
  DATABASE_URL: "postgresql+asyncpg://postgres:CHANGE_ME_IN_CLUSTER_POSTGRES_PASSWORD@postgres:5432/agentops"
  OPENAI_API_KEY: "CHANGE_ME_OPENAI_KEY_IF_USING_REAL_PROVIDER"
